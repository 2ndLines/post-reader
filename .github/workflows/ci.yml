# 每个 PR 与 main 推送运行同一套快速检查（05 §5.3；任务卡 P0-CI-01）。
# 规则：Action 一律按完整 SHA 固定并注释版本；顶层只读权限；同分支新运行取消旧运行。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: "1"
  TURBO_TELEMETRY_DISABLED: "1"
  PROMPTFOO_DISABLE_TELEMETRY: "1"
  PULUMI_SKIP_UPDATE_CHECK: "true"
  # CI 中不安装本地 git 钩子（prepare 脚本里的 lefthook install）
  LEFTHOOK: "0"
  # 与 .mise.toml 保持一致，由 pnpm check:versions 校验
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256_LINUX_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  ci:
    name: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出（完整历史，供 gitleaks 扫描）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 安装 pnpm（版本取自 package.json#packageManager）
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: 安装 Node（版本取自 .nvmrc）
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 工具版本一致性
        run: pnpm check:versions

      - name: Action 固定 SHA
        run: pnpm check:pins

      - name: CODEOWNERS 覆盖受保护路径
        run: pnpm check:codeowners

      - name: 文档相对链接
        run: pnpm check:links

      - name: openapi.yaml 与契约源一致
        run: pnpm contracts:check

      - name: 已发布的迁移未被修改或删除
        run: pnpm check:migrations

      - name: 请求签名黄金向量与独立 Python 实现一致
        run: pnpm check:sig-vectors

      - name: config/ 通过 schema（列出未标定参数，不因未标定失败）
        run: pnpm check:config

      - name: Biome
        run: pnpm exec biome ci .

      - name: 类型检查
        run: pnpm typecheck

      - name: 单元测试
        run: pnpm test

      # P0-REPO-01 AC5 要求无报告；曾有一次回归因本地只跑 verify 而漏掉，故放进每次 CI
      - name: knip
        run: pnpm knip

      - name: gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256_LINUX_X64}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          # 只扫描被测提交可达的完整历史；默认的 --all 会把其他分支（例如别的 PR）的问题算到本次运行上
          "$RUNNER_TEMP/gitleaks" git . --redact --no-banner --exit-code 1 --log-opts=HEAD

      - name: 许可证
        run: pnpm check:licenses

      - name: pnpm audit
        run: pnpm audit --prod --audit-level high
