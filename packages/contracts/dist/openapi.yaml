# 由 packages/contracts 生成（pnpm contracts:gen），请勿手改
openapi: 3.1.0
info:
  title: Post&Comments Reader 公共 API
  version: 1.0.0
  description: 由 packages/contracts 生成，请勿手改。接口表见 docs/archs/02-backend.md §4.2。
servers:
  - url: /v1
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: accessToken（ES256）；refresh 与 Apple 通知各有单独的凭据
  schemas:
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          enum:
            - AUTH_EXPIRED
            - SIGNATURE_INVALID
            - REPLAY_DETECTED
            - ATTEST_REQUIRED
            - RATE_LIMITED
            - QUOTA_EXHAUSTED
            - TIER_REQUIRED
            - REGION_MISMATCH
            - CONTENT_BLOCKED
            - UPSTREAM_DEGRADED
            - VALIDATION_FAILED
            - CLIENT_TOO_OLD
            - DAILY_LIMIT
            - AUTH_REVOKED
            - SERVICE_PAUSED
            - BRANCH_DISABLED
            - SITE_RULE_DISABLED
            - NOT_FOUND
            - INTERNAL
        traceId:
          type: string
          minLength: 1
        resetAt:
          type: string
          format: date-time
      required:
        - title
        - status
        - code
        - traceId
    CanonicalPost:
      type: object
      properties:
        schemaVersion:
          type: number
          enum:
            - 1
        source:
          type: object
          properties:
            site:
              type: string
              minLength: 1
            url:
              type: string
              format: uri
            postId:
              type: string
              minLength: 1
            fetchedAt:
              type: string
              format: date-time
            cacheScope:
              type: string
              enum:
                - PUBLIC
                - PRIVATE
          required:
            - site
            - url
            - postId
            - fetchedAt
            - cacheScope
        langHint:
          type: string
          pattern: ^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{1,8})*$
        units:
          type: array
          items:
            type: object
            properties:
              unitId:
                type: string
                minLength: 1
              kind:
                type: string
                enum:
                  - post
                  - comment
              authorId:
                type: string
                minLength: 1
              authorDisplay:
                type: string
              parentId:
                type: string
                minLength: 1
              parentConfidence:
                type: string
                enum:
                  - high
                  - low
              cleanText:
                type: string
              likes:
                type: integer
                minimum: 0
              hasImages:
                type: boolean
              hasVideo:
                type: boolean
              hash:
                type: string
                pattern: ^[0-9a-f]{64}$
            required:
              - unitId
              - kind
              - authorId
              - parentConfidence
              - cleanText
              - hasImages
              - hasVideo
              - hash
          minItems: 1
      required:
        - schemaVersion
        - source
        - units
    Prefs:
      type: object
      properties:
        density:
          type: string
          enum:
            - brief
            - standard
            - deep
        weights:
          type: array
          items:
            type: string
            enum:
              - op_replies
              - practical_reversal
              - dedupe_spam
        style:
          type: string
          enum:
            - solo_radio
            - duo_roundtable
            - fireside
            - rapid_cut
            - crowd_list
      required:
        - density
        - weights
        - style
    AuthSession:
      type: object
      properties:
        accessToken:
          type: string
          minLength: 1
        refreshToken:
          type: string
          minLength: 1
        sessionKey:
          type: string
          pattern: ^[A-Za-z0-9+/]*={0,2}$
        user:
          type: object
          properties:
            userId:
              type: string
              minLength: 1
            homeRegion:
              type: string
              enum:
                - cn
                - intl
            tier:
              type: string
              enum:
                - free
                - plus
                - pro
          required:
            - userId
            - homeRegion
            - tier
      required:
        - accessToken
        - refreshToken
        - sessionKey
        - user
    Me:
      type: object
      properties:
        tier:
          type: string
          enum:
            - free
            - plus
            - pro
        quota:
          type: object
          properties:
            remainingMc:
              type: integer
            grantedMc:
              type: integer
              minimum: 0
            resetAt:
              type: string
              format: date-time
            rateVersion:
              type: string
              minLength: 1
          required:
            - remainingMc
            - grantedMc
            - resetAt
            - rateVersion
        periodEnd:
          type: string
          format: date-time
        homeRegion:
          type: string
          enum:
            - cn
            - intl
        billingTz:
          type: string
          minLength: 1
        flags:
          type: object
          additionalProperties:
            type: boolean
        entitlements:
          type: object
          properties:
            densities:
              type: array
              items:
                type: string
                enum:
                  - brief
                  - standard
                  - deep
            styles:
              type: array
              items:
                type: string
                enum:
                  - solo_radio
                  - duo_roundtable
                  - fireside
                  - rapid_cut
                  - crowd_list
          required:
            - densities
            - styles
      required:
        - tier
        - quota
        - periodEnd
        - homeRegion
        - billingTz
        - flags
        - entitlements
    JobStatus:
      type: object
      properties:
        jobId:
          type: string
          minLength: 1
        state:
          type: string
          enum:
            - created
            - admitted
            - planning
            - scripting
            - synthesizing
            - completed
            - rejected
            - failed
            - cancelled
            - quota_exhausted
        degraded:
          type: array
          items:
            anyOf:
              - type: string
                enum:
                  - moderation
                  - tts_backup
                  - llm_backup
                  - translation_dropped
                  - select_fallback
              - type: string
                minLength: 1
        readySegments:
          type: integer
          minimum: 0
      required:
        - jobId
        - state
        - degraded
        - readySegments
  parameters: {}
paths:
  /auth/apple:
    post:
      operationId: signInWithApple
      summary: Sign in with Apple
      security: []
      parameters:
        - schema:
            type: string
            minLength: 1
            description: 客户端版本；低于最低版本时返回 426 CLIENT_TOO_OLD
          required: true
          description: 客户端版本；低于最低版本时返回 426 CLIENT_TOO_OLD
          name: X-Client-Version
          in: header
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identityToken:
                  type: string
                  minLength: 1
                authorizationCode:
                  type: string
                  minLength: 1
                nonce:
                  type: string
                  minLength: 1
                deviceId:
                  type: string
                  minLength: 1
                storefront:
                  type: string
                  pattern: ^[A-Z]{3}$
                ageConfirmed:
                  type: boolean
              required:
                - identityToken
                - authorizationCode
                - nonce
                - deviceId
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                    minLength: 1
                  refreshToken:
                    type: string
                    minLength: 1
                  sessionKey:
                    type: string
                    pattern: ^[A-Za-z0-9+/]*={0,2}$
                  user:
                    type: object
                    properties:
                      userId:
                        type: string
                        minLength: 1
                      homeRegion:
                        type: string
                        enum:
                          - cn
                          - intl
                      tier:
                        type: string
                        enum:
                          - free
                          - plus
                          - pro
                    required:
                      - userId
                      - homeRegion
                      - tier
                required:
                  - accessToken
                  - refreshToken
                  - sessionKey
                  - user
        default:
          description: 错误（RFC 9457 problem+json）；客户端只按 code 分支处理
          content:
            application/problem+json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    default: about:blank
                  title:
                    type: string
                  status:
                    type: integer
                    minimum: 400
                    maximum: 599
                  detail:
                    type: string
                  instance:
                    type: string
                  code:
                    type: string
                    enum:
                      - AUTH_EXPIRED
                      - SIGNATURE_INVALID
                      - REPLAY_DETECTED
                      - ATTEST_REQUIRED
                      - RATE_LIMITED
                      - QUOTA_EXHAUSTED
                      - TIER_REQUIRED
                      - REGION_MISMATCH
                      - CONTENT_BLOCKED
                      - UPSTREAM_DEGRADED
                      - VALIDATION_FAILED
                      - CLIENT_TOO_OLD
                      - DAILY_LIMIT
                      - AUTH_REVOKED
                      - SERVICE_PAUSED
                      - BRANCH_DISABLED
                      - SITE_RULE_DISABLED
                      - NOT_FOUND
                      - INTERNAL
                  traceId:
                    type: string
                    minLength: 1
                  resetAt:
                    type: string
                    format: date-time
                required:
                  - title
                  - status
                  - code
                  - traceId
