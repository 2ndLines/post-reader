packages:
  - apps/*
  - apps/testbench/*
  - packages/*
  - tools/*
  # 验证脚本是独立项目（自带锁文件与同样的安全设置），不进入主工作区的依赖、许可证与 knip 范围
  - "!tools/verify"

# 只允许列出的依赖运行安装脚本（pnpm 11 起取代 onlyBuiltDependencies）；新增需在 PR 中说明原因
allowBuilds:
  # 不运行它的 postinstall（会静默改写 .git/hooks）；钩子由根 package.json 的 prepare 显式安装
  lefthook: false
  # OpenTelemetry 的间接依赖；安装脚本只做安装后自检，V1 实测不需要（ADR 0017）
  protobufjs: false
  # drizzle-kit 依赖的 esbuild：安装后自检脚本，V1 实测不需要（ADR 0017）
  esbuild: false
  # cbor-x 的可选原生加速；cbor-x 在纯 JS 下工作，不需要构建（P2-SRV-07）
  cbor-extract: false

# 新版本发布满 3 天（单位：分钟）才允许安装（05 §2.5）
minimumReleaseAge: 4320

strictPeerDependencies: true
