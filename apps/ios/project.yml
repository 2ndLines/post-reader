# XcodeGen 工程定义（01 §4.1）。.xcodeproj 不入库：改本文件后执行 `make project`。
name: PostReader
options:
  deploymentTarget: { iOS: "18.0" }
  bundleIdPrefix: com.example.postreader
  createIntermediateGroups: true
  generateEmptyDirectories: false
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEVELOPMENT_TEAM: ""
    TARGETED_DEVICE_FAMILY: "1"
configs:
  Debug: debug
  Staging: release
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Release.xcconfig
packages:
  ReaderCore: { path: Packages/ReaderCore }
  APIClient: { path: Packages/APIClient }
  Storage: { path: Packages/Storage }
  Networking: { path: Packages/Networking }
  Capture: { path: Packages/Capture }
  Audio: { path: Packages/Audio }
  Commerce: { path: Packages/Commerce }
  ReaderDomain: { path: Packages/ReaderDomain }
  DesignSystem: { path: Packages/DesignSystem }
  Features: { path: Packages/Features }
  TestSupport: { path: Packages/TestSupport }
targets:
  PostReader:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: [Info.plist, "*.entitlements"]
    # 不用 XcodeGen 的 info / entitlements 选项：它们会按 properties 重新生成并覆盖这两个文件
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/PostReader.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - package: Features
        product: FeatureOnboarding
      - package: Features
        product: FeatureHome
      - package: Features
        product: FeaturePlayer
      - target: ShareExtension
    # SwiftLint 不放在构建阶段：ENABLE_USER_SCRIPT_SANDBOXING 下脚本只能读取声明的输入文件，
    # 逐个声明全部源文件不可维护。lint 由 make lint、Xcode Cloud 与 CI 执行（P4-IOS-01 Q2）。
  ShareExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension
        excludes: [Info.plist, "*.entitlements"]
    settings:
      base:
        INFOPLIST_FILE: ShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShareExtension/ShareExtension.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).share
    dependencies:
      - package: ReaderCore
      - package: Storage
        product: StorageInbox
      - package: Capture
        product: CaptureDirect
  PostReaderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PostReader
    dependencies:
      - target: PostReader
schemes:
  PostReader:
    build:
      targets:
        PostReader: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PostReaderUITests
        - package: ReaderCore/ReaderCoreTests
        - package: Storage/StorageTests
        - package: Storage/StorageInboxTests
        - package: Networking/NetworkingTests
        - package: Capture/CaptureTests
        - package: Capture/CaptureDirectTests
        - package: Audio/AudioTests
        - package: Commerce/CommerceTests
        - package: ReaderDomain/ReaderDomainTests
        - package: DesignSystem/DesignSystemTests
        - package: Features/FeatureOnboardingTests
        - package: Features/FeatureHomeTests
        - package: Features/FeaturePlayerTests
        - package: TestSupport/TestSupportTests
    archive:
      config: Release
