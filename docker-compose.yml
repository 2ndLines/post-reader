# 本地开发依赖（05 §3.2、附录 D；任务卡 P0-REPO-05）。只用于本地，账号密码见 env.example。
# 镜像一律按多架构 index digest 固定（arm64 开发机与 amd64 CI 共用同一引用），由 Renovate 更新（05 §5.5）。
# 集成测试（Testcontainers）从本文件读取同一镜像引用，不另写版本。
# 端口只绑定 127.0.0.1。不使用 MinIO（05 §3.2）。vendor-mock 在 P2 加入。
name: post-reader

services:
  postgres:
    image: postgres:18.7@sha256:64c8b0d31e4ab6ea665e8426ea406a94bf52de3c05b3a4a8bf713704eefa9328
    environment:
      POSTGRES_USER: reader
      POSTGRES_PASSWORD: reader-local-only
      POSTGRES_DB: reader
    ports: ["127.0.0.1:5432:5432"]
    # PostgreSQL 18 镜像的数据目录改为 /var/lib/postgresql/<major>/docker，挂载点为上一级目录
    volumes:
      - pgdata:/var/lib/postgresql
      - ./tools/local/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reader -d reader"]
      interval: 2s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:8.1.12@sha256:5032c4dd7abe08d6fd9382054608183e2bf1f7e3895ef619b8784698454325f7
    # BullMQ 要求 noeviction；只使用 Redis 7.0 社区版命令集（ADR 0011）
    command: ["valkey-server", "--maxmemory-policy", "noeviction"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    command: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data"]
    volumes:
      - s3data:/data
      - ./tools/local/s3.json:/etc/seaweedfs/s3.json:ro
    ports: ["127.0.0.1:8333:8333"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status && nc -z 127.0.0.1 8333",
        ]
      interval: 2s
      timeout: 3s
      retries: 60

  # 一次性任务：创建本地 bucket（与 s3 同一镜像）
  s3-init:
    image: chrislusf/seaweedfs:4.55@sha256:7ca46aeae2f223b37e5d91593c17ab37738eec6df6ab69b48a0487f7643342b9
    depends_on:
      s3: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/init/create-buckets.sh"]
    volumes:
      - ./tools/local/create-buckets.sh:/init/create-buckets.sh:ro
    restart: "no"

  mailpit:
    image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
    environment:
      MP_DISABLE_VERSION_CHECK: "true"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    profiles: [tracing]
    image: jaegertracing/jaeger:2.23.0@sha256:3823829974ccfc2485d2e48b165579091f32295022ae80ca49704e2f4834116e
    ports: ["127.0.0.1:16686:16686", "127.0.0.1:4318:4318"]

volumes:
  pgdata: {}
  s3data: {}
